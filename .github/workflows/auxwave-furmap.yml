name: Build Auxwave Furmap Normal Map

on:
  workflow_dispatch:

env:
  unityPackage: Auxwave_Furmap_Normal_Map.unitypackage

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Make file list
        run: |
          TARGET_DIR=$(find . -i-path "*Auxwave*Furmap*" -type d | head -n 1)
          if [ -z "$TARGET_DIR" ]; then
            echo "Error: Could not find any folder matching 'Auxwave Furmap' in the repository!"
            echo "Current repository file structure:"
            find . -maxdepth 3 -not -path '*/.*'
            exit 1
          fi
          echo "Found folder: $TARGET_DIR"
          find "$TARGET_DIR" -name "*.meta" -type f > metalist
          find Assets -maxdepth 2 -name "*.meta" -type f >> metalist 2>/dev/null || true

      - name: Create UnityPackage
        uses: pCYSl5EDgo/create-unitypackage@master
        with:
          package-path: ${{ env.unityPackage }}
          include-files: metalist

      - name: Add Icon to UnityPackage
        uses: foxscore/add-icon-to-unitypackage@v1
        with:
          package_path: ${{ env.unityPackage }}
          icon_path: 'Assets/resources/icon.png'
          icon_not_found_behavior: 'fail'
          icon_already_present_behavior: 'fail'

      - name: Upload UnityPackage
        uses: actions/upload-artifact@v4
        with:
          name: Auxwave-Furmap-Normal-Map
          path: ${{ env.unityPackage }}
